---
- name: Ensure account groups exist
  become: true
  ansible.builtin.group:
    name: '{{ item }}'
    system: true
    state: present
  loop:
    - wheel
    - video
    - audio
    - input
    - autologin

- name: Create isolated user accounts
  become: true
  ansible.builtin.user:
    name: '{{ item.name }}'
    groups: '{{ item.groups | join(",") }}'
    append: true
    shell: /usr/bin/zsh
    create_home: true
    home: '/home/{{ item.name }}'
    state: present
  loop: '{{ profiles_users }}'

- name: Restrict home directories to their owners
  become: true
  ansible.builtin.file:
    path: '/home/{{ item.name }}'
    state: directory
    owner: '{{ item.name }}'
    group: '{{ item.name }}'
    mode: '0700'
  loop: '{{ profiles_users }}'

- name: Create the shared-data group
  become: true
  ansible.builtin.group:
    name: shared-data
    state: present

- name: Add profile accounts to the shared-data group
  become: true
  ansible.builtin.user:
    name: '{{ item.name }}'
    groups: shared-data
    append: true
  loop: '{{ profiles_users }}'

- name: Ensure /home/shared exists
  become: true
  ansible.builtin.file:
    path: /home/shared
    state: directory
    owner: root
    group: shared-data
    mode: '2775'

- name: Share /home/shared through the shared-data group
  become: true
  ansible.builtin.script: share-home.sh
  register: shared_home_perms
  changed_when: shared_home_perms.stdout | trim == 'changed'
