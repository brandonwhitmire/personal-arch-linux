---
# i3 window manager setup
#
# Boot Sequence:
# systemd boot -> systemd unitfile -> agetty (autologin into user) -> zsh (sources .zshrc) -> startx (sources .xinitrc) -> i3
#
- name: Install i3 pkgs
  become: true
  ansible.builtin.package:
    name:
      - i3  # metapackage of various i3 packages
      - redshift  # screen color temperature adjustment (includes redshift-gtk)
    state: present

- name: Install system xinitrc
  become: true
  ansible.builtin.template:
    src: xinitrc.j2
    dest: /etc/X11/xinit/xinitrc
    owner: root
    group: root
    mode: '0755'
    backup: false

- name: Ensure system i3 directories exist
  become: true
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/i3
    - /usr/local/lib/i3

- name: Install system i3 config
  become: true
  ansible.builtin.template:
    src: i3_rc.j2
    dest: /etc/i3/config
    owner: root
    group: root
    mode: '0644'
    backup: false
  register: i3_config_changed

- name: Install system i3 powermenu
  become: true
  ansible.builtin.template:
    force: true
    src: powermenu.sh.j2
    dest: /usr/local/lib/i3/powermenu.sh
    owner: root
    group: root
    mode: '0755'
  register: i3_config_changed

- name: Install system i3 autostart
  become: true
  ansible.builtin.template:
    force: true
    src: autostart.sh.j2
    dest: /usr/local/lib/i3/autostart.sh
    owner: root
    group: root
    mode: '0755'
  register: i3_config_changed

- name: Remove per-user i3 configs that hide the system config
  become: true
  ansible.builtin.file:
    path: '/home/{{ item }}/.config/i3/config'
    state: absent
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"

- name: Install system redshift config
  become: true
  ansible.builtin.template:
    force: true
    src: redshift.conf.j2
    dest: /etc/redshift.conf
    owner: root
    group: root
    mode: '0644'

- name: Create /usr/bin/hack script (quick lab dev environment)
  become: true
  ansible.builtin.copy:
    src: hack
    dest: /usr/bin/hack
    mode: '0755'
    owner: root
    group: root

- name: Install hack.desktop file for Rofi launcher
  become: true
  ansible.builtin.copy:
    src: hack.desktop
    dest: /usr/share/applications/hack.desktop
    mode: '0644'
    owner: root
    group: root

- name: Install AUR pkgs
  vars:
    function_yay_aur_packages:
      - pa-applet-git  # applet for PulseAudio
  ansible.builtin.import_role:
    name: function_yay

# Validate i3 configuration syntax using i3 built-in check
- name: Verify i3 configuration syntax
  become: false
  ansible.builtin.command: i3 -C -c /etc/i3/config
  when: i3_config_changed is defined and i3_config_changed.changed
  changed_when: false

- name: Check if i3 is running and ready
  become: false
  ansible.builtin.shell: |
    set -o pipefail
    # Check if i3 process exists
    if ! pgrep -x i3 > /dev/null; then
      exit 1
    fi
    # Verify i3 socket is accessible by trying a simple command
    # This will fail if DISPLAY is not set or socket is not ready
    i3-msg -t get_version > /dev/null 2>&1
  register: i3_ready
  failed_when: false
  changed_when: false
  environment:
    DISPLAY: "{{ ansible_facts['env']['DISPLAY'] | default(':0') }}"

- name: Reload i3 configuration
  become: false
  ansible.builtin.command: i3-msg reload
  changed_when: false
  retries: 3
  delay: 2
  register: i3_reload_result
  until: i3_reload_result.rc == 0
  when:
    - i3_config_changed is defined and i3_config_changed.changed
    - i3_ready is defined and i3_ready.rc == 0
  environment:
    DISPLAY: "{{ ansible_facts['env']['DISPLAY'] | default(':0') }}"
