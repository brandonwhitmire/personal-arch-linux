---
# Baseline Role - Handlers
# Handles service restarts when configuration changes

- name: restart systemd-logind
  become: true
  ansible.builtin.systemd:
    name: systemd-logind.service
    state: restarted
    daemon_reload: true
  listen: restart systemd-logind

- name: restart bluetooth
  become: true
  ansible.builtin.systemd:
    name: bluetooth.service
    state: restarted
  listen: restart bluetooth

