- name: Add functionality for shells
  become: true
  ansible.builtin.blockinfile:
    path: /etc/zsh/zshrc
    marker: "# {mark} zsh_rc"
    block: "{{ lookup('file', 'files/zsh_rc') }}"
    create: true
    owner: root
    group: root
    mode: '0644'
    state: present

- name: Add tmux autostart for interactive shells
  become: true
  ansible.builtin.blockinfile:
    path: /etc/zsh/zshrc
    marker: '# {mark} tmux_autostart'
    block: |
      # Auto-start tmux for interactive shells.
      if [ -z "$TMUX" ] && [ -n "$PS1" ] && command -v tmux >/dev/null 2>&1; then
          tmux attach-session -t main || tmux new-session -s main
      fi
    owner: root
    group: root
    mode: '0644'
    state: present

- name: Point Starship at the system config
  become: true
  ansible.builtin.blockinfile:
    path: /etc/zsh/zshenv
    marker: '# {mark} starship_config'
    block: |
      export STARSHIP_CONFIG=/etc/starship.toml
    create: true
    owner: root
    group: root
    mode: '0644'
    state: present

- name: Find per-user shell files that may contain old blocks
  become: true
  ansible.builtin.stat:
    path: '{{ item }}'
  loop: "{{ ['/home/dev', '/home/obb', '/home/' + ansible_user, '/root'] | unique | product(['.zshrc', '.bashrc']) | map('join', '/') | list }}"
  register: shell_user_rc

- name: Remove per-user shell blocks now provided system-wide
  become: true
  ansible.builtin.blockinfile:
    path: '{{ item.0 }}'
    marker: '{{ item.1 }}'
    state: absent
  loop: "{{ shell_user_rc.results | selectattr('stat.exists') | map(attribute='item') | product(['# {mark} zsh_rc', '# {mark} tmux_autostart']) | list }}"

- name: Ensure tmux directories exist for each account
  become: true
  ansible.builtin.file:
    path: '/home/{{ item.0 }}/{{ item.1 }}'
    state: directory
    owner: '{{ item.0 }}'
    group: '{{ item.0 }}'
    mode: '0755'
  loop: "{{ ['dev', 'obb', ansible_user] | unique | product(['my_data/tmux_logs', '.tmux', '.tmux/plugins', '.tmux/resurrect']) | list }}"

- name: Deploy tmux configuration for each account
  become: true
  ansible.builtin.copy:
    src: files/tmux.conf
    dest: '/home/{{ item }}/.tmux.conf'
    owner: '{{ item }}'
    group: '{{ item }}'
    mode: '0644'
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"

- name: Give each account ownership of its TPM checkout
  become: true
  ansible.builtin.file:
    path: '/home/{{ item }}/.tmux/plugins/tpm'
    state: directory
    owner: '{{ item }}'
    group: '{{ item }}'
    recurse: true
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"

- name: Install TPM for each account
  become: true
  become_user: '{{ item }}'
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: '/home/{{ item }}/.tmux/plugins/tpm'
    version: master
  environment:
    HOME: '/home/{{ item }}'
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"

- name: Install tmux plugins for each account
  become: true
  become_user: '{{ item }}'
  ansible.builtin.shell: |
    set -e
    tmux start-server
    tmux new-session -d -s ansible-tpm-bootstrap 2>/dev/null || true
    "$TMUX_PLUGIN_MANAGER_PATH/tpm/bin/install_plugins"
    tmux kill-server
  args:
    executable: /bin/bash
  environment:
    HOME: '/home/{{ item }}'
    TMUX_PLUGIN_MANAGER_PATH: '/home/{{ item }}/.tmux/plugins/'
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"
  changed_when: false

- name: Bootstrap empty tmux resurrection file for each account
  become: true
  ansible.builtin.copy:
    content: ""
    dest: '/home/{{ item }}/.tmux/resurrect/last'
    force: false
    owner: '{{ item }}'
    group: '{{ item }}'
    mode: '0644'
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"

- name: Set zsh as the login shell for every account
  become: true
  ansible.builtin.user:
    name: '{{ item }}'
    shell: /usr/bin/zsh
  loop: "{{ ['dev', 'obb', ansible_user, 'root'] | unique }}"

- name: Build pkgfile cache (first time only)
  become: true
  ansible.builtin.command:
    cmd: pkgfile --update
    creates: /var/cache/pkgfile/

- name: Ensure nvim directory exists for each account
  become: true
  ansible.builtin.file:
    path: '/home/{{ item }}/.config/nvim/'
    state: directory
    owner: '{{ item }}'
    group: '{{ item }}'
    mode: '0755'
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"

# https://nvchad.com/docs/quickstart/install#install
- name: Clone nvChad for each account  # noqa latest[git]
  become: true
  become_user: '{{ item }}'
  ansible.builtin.git:
    repo: https://github.com/NvChad/starter
    dest: '/home/{{ item }}/.config/nvim'
  environment:
    HOME: '/home/{{ item }}'
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"

- name: Initialize nvim for each account
  become: true
  become_user: '{{ item }}'
  ansible.builtin.command:
    cmd: nvim --headless '+qa'
  environment:
    HOME: '/home/{{ item }}'
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"
  changed_when: false
  failed_when: false

- name: Sync nvim plugins with Lazy for each account
  become: true
  become_user: '{{ item }}'
  ansible.builtin.command:
    cmd: nvim --headless '+lua require("lazy").sync()' '+qa'
  environment:
    HOME: '/home/{{ item }}'
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"
  changed_when: false
  failed_when: false

- name: Install Mason packages for each account
  become: true
  become_user: '{{ item }}'
  ansible.builtin.command:
    cmd: nvim --headless '+MasonInstallAll' '+qa'
  environment:
    HOME: '/home/{{ item }}'
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"
  changed_when: false
  failed_when: false

- name: Ensure system alacritty config directory exists
  become: true
  ansible.builtin.file:
    path: /etc/alacritty
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install system alacritty config
  become: true
  ansible.builtin.copy:
    force: true
    src: files/alacritty.toml
    dest: /etc/alacritty/alacritty.toml
    owner: root
    group: root
    mode: '0644'

- name: Template /etc/environment
  become: true
  ansible.builtin.blockinfile:
    path: /etc/environment
    marker: '# {mark} environment_config'
    block: |
      EDITOR=/usr/bin/nvim
      BROWSER={{ shell_default_browser_fullpath }}
      TERMINAL=/usr/bin/alacritty
    create: true
    state: present
    mode: '0644'
    owner: root
    group: root

- name: Install system default applications
  become: true
  ansible.builtin.blockinfile:
    path: /etc/xdg/mimeapps.list
    marker: '# {mark} mimeapps_list_config'
    block: |
      [Default Applications]
      text/html={{ shell_default_browser_name }}.desktop
      x-scheme-handler/http={{ shell_default_browser_name }}.desktop
      x-scheme-handler/https={{ shell_default_browser_name }}.desktop
      x-scheme-handler/ftp={{ shell_default_browser_name }}.desktop
      x-scheme-handler/chrome={{ shell_default_browser_name }}.desktop
      application/x-extension-htm={{ shell_default_browser_name }}.desktop
      application/x-extension-html={{ shell_default_browser_name }}.desktop
      application/x-extension-shtml={{ shell_default_browser_name }}.desktop
      application/xhtml+xml={{ shell_default_browser_name }}.desktop
      application/x-extension-xhtml={{ shell_default_browser_name }}.desktop
      application/x-extension-xht={{ shell_default_browser_name }}.desktop
      image/jpeg={{ shell_default_image_viewer }}.desktop
      image/png={{ shell_default_image_viewer }}.desktop
      inode/directory={{ shell_default_file_manager }}.desktop
    create: true
    state: present
    mode: '0644'
    owner: root
    group: root

- name: Install system Starship configuration
  become: true
  ansible.builtin.copy:
    force: true
    src: files/starship.toml
    dest: /etc/starship.toml
    owner: root
    group: root
    mode: '0644'
