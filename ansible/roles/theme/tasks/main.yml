---
# Dark theme setup
# Reference: https://wiki.archlinux.org/title/GTK#Dark_theme_variant
# https://wiki.archlinux.org/title/Uniform_look_for_Qt_and_GTK_applications#QGtkStyle
# https://wiki.archlinux.org/title/GTK#Theme_not_applied_to_root_applications
- name: Ensure system GTK2 settings directory exists
  become: true
  ansible.builtin.file:
    path: /etc/gtk-2.0
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Check whether the GTK2 settings path is a symlink
  become: true
  ansible.builtin.stat:
    path: /etc/gtk-2.0/gtkrc
  register: theme_gtk2_settings

- name: Remove a GTK2 settings symlink before writing the system file
  become: true
  ansible.builtin.file:
    path: /etc/gtk-2.0/gtkrc
    state: absent
  when: theme_gtk2_settings.stat.islnk | default(false)

- name: Install system GTK2 settings
  become: true
  ansible.builtin.copy:
    dest: /etc/gtk-2.0/gtkrc
    owner: root
    group: root
    mode: '0644'
    content: |
      gtk-icon-theme-name = "{{ theme_selected_theme }}"
      gtk-theme-name = "{{ theme_selected_theme }}"
      gtk-font-name = "DejaVu Sans 11"

- name: '[gtk2] Install GTK2 from AUR'
  vars:
    function_yay_aur_packages:
      - gtk2
    function_yay_aur_packages_state: present
  ansible.builtin.import_role:
    name: function_yay

- name: Ensure system GTK3 settings directory exists
  become: true
  ansible.builtin.file:
    path: /etc/gtk-3.0
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Check whether the GTK3 settings path is a symlink
  become: true
  ansible.builtin.stat:
    path: /etc/gtk-3.0/settings.ini
  register: theme_gtk3_settings

- name: Remove a GTK3 settings symlink before writing the system file
  become: true
  ansible.builtin.file:
    path: /etc/gtk-3.0/settings.ini
    state: absent
  when: theme_gtk3_settings.stat.islnk | default(false)

- name: Install system GTK3 settings
  become: true
  ansible.builtin.copy:
    dest: /etc/gtk-3.0/settings.ini
    owner: root
    group: root
    mode: '0644'
    content: |
      [Settings]
      gtk-theme-name = {{ theme_selected_theme }}
      gtk-icon-theme-name = {{ theme_selected_theme }}
      gtk-font-name = DejaVu Sans 11
      gtk-application-prefer-dark-theme = true

- name: Remove per-user GTK settings that hide the system theme
  become: true
  ansible.builtin.file:
    path: '/home/{{ item.0 }}/{{ item.1 }}'
    state: absent
  loop: "{{ ['dev', 'obb', ansible_user] | unique | product(['.gtkrc-2.0', '.config/gtk-3.0/settings.ini']) | list }}"

- name: '[Qt4] Use GTK2 themes'
  ansible.builtin.blockinfile:
    path: ~/.config/Trolltech.conf
    marker: '# {mark} qt4_config'
    block: |
      [Qt]
      style=GTK+
    mode: '0644'
    create: true
    state: present

- name: '[Qt5/6] Install AUR pkgs'
  vars:
    function_yay_aur_packages:
      - dracula-gtk-theme  # dark theme
      - qt5-styleplugins  # GUI framework
      # REMOVED: https://wiki.archlinux.org/title/Uniform_look_for_Qt_and_GTK_applications_#QGtkStyle
      # - qt6gtk2  # GUI framework
  ansible.builtin.import_role:
    name: function_yay
