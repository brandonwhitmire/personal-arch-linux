# Idle lock for the Hyprland session.
# The i3 session arms this with: xset s 900 5 && xss-lock -- i3lock
# Fifteen minutes of idle locks the screen. Suspend locks immediately.

general {
    lock_cmd = pidof hyprlock || hyprlock --config /etc/xdg/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}
