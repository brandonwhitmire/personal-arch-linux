---
# dunst role - notification daemon with Dracula dark theme
# This role installs and configures dunst with the Dracula dark theme

- name: Install dunst package
  become: true
  ansible.builtin.package:
    name:
      - dunst  # system notifications
    state: present

- name: Ensure system dunst config directory exists
  become: true
  ansible.builtin.file:
    path: /etc/dunst
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create system dunst config with Dracula dark theme
  become: true
  ansible.builtin.template:
    src: dunstrc.j2
    dest: /etc/dunst/dunstrc
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: Remove per-user dunst configs that hide the system config
  become: true
  ansible.builtin.file:
    path: '/home/{{ item }}/.config/dunst/dunstrc'
    state: absent
  loop: "{{ ['dev', 'obb', ansible_user] | unique }}"
